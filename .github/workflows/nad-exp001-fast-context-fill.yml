name: NAD EXP001 Fast Context Fill

on:
  push:
    branches:
      - exp/neural-blueprint-slots-qwen05b-20261006
    paths:
      - ".github/workflows/nad-exp001-fast-context-fill.yml"
      - "experiments/neural_algorithm_decompilation/EXP001_blueprint_slots_qwen05b.py"

permissions:
  contents: read

jobs:
  context-fill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_XET: "1"
      WORLDS: "12"
      MODEL_ID: "Qwen/Qwen2.5-0.5B-Instruct"
      OUTDIR: "outputs"
    steps:
      - name: Fetch experiment script only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p experiments/neural_algorithm_decompilation
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/experiments/neural_algorithm_decompilation/EXP001_blueprint_slots_qwen05b.py?ref=$GITHUB_SHA" \
            -o experiments/neural_algorithm_decompilation/EXP001_blueprint_slots_qwen05b.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU inference stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.46.3" accelerate safetensors

      - name: Run context-fill slot probe
        run: python experiments/neural_algorithm_decompilation/EXP001_blueprint_slots_qwen05b.py

      - name: Upload context-fill results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nad-exp001-context-fill-results
          path: outputs/
          if-no-files-found: warn
