name: real-deepseek-moe-004

on:
  push:
    branches:
      - exp/real-deepseek-moe-001
  workflow_dispatch:

jobs:
  qa-microprotocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Runner info
        run: |
          mkdir -p results
          uname -a | tee results/runner_info.txt
          nproc | tee -a results/runner_info.txt
          free -h | tee -a results/runner_info.txt
          df -h / | tee -a results/runner_info.txt

      - name: Download llama.cpp
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 3 -o /tmp/llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b11342/llama-b11342-bin-ubuntu-x64.tar.gz
          mkdir -p /tmp/llama
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama
          LLAMA_SERVER=$(find /tmp/llama -type f -name llama-server | head -1)
          test -n "$LLAMA_SERVER"
          chmod +x "$LLAMA_SERVER"
          echo "LLAMA_SERVER=$LLAMA_SERVER" >> "$GITHUB_ENV"
          "$LLAMA_SERVER" --version | tee results/llama_server_version.txt

      - name: Download DeepSeekMoE-16B Chat IQ3_S
        run: |
          set -euxo pipefail
          MODEL=/tmp/deepseek-moe-16b-chat.i1-IQ3_S.gguf
          curl -L --fail --retry 8 --retry-delay 5 -o "$MODEL" "https://huggingface.co/mradermacher/deepseek-moe-16b-chat-i1-GGUF/resolve/main/deepseek-moe-16b-chat.i1-IQ3_S.gguf?download=true"
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          ls -lh "$MODEL" | tee results/model_file.txt
          sha256sum "$MODEL" | tee results/model_sha256.txt

      - name: Start server
        run: |
          set -euxo pipefail
          "$LLAMA_SERVER" -m "$MODEL" -c 2048 -t 4 --host 127.0.0.1 --port 8080 --parallel 1 > results/server.log 2>&1 &
          echo $! > /tmp/llama_server.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              free -h | tee results/memory_after_server.txt
              exit 0
            fi
            sleep 2
          done
          tail -200 results/server.log
          exit 1

      - name: Run Q-A microprotocol experiment
        run: |
          python3 - <<'PY'
          import json, csv, re, time, urllib.request, statistics
          from pathlib import Path

          tasks = [
              ("mul","A warehouse has 17 shelves with 23 boxes on each shelf. How many boxes are there in total?","391","17 × 23 = 374."),
              ("compose","Start with 7. Multiply by 3, add 2, then multiply the result by 2. What number do you get?","46","After adding 2, the running value is 25."),
              ("logic","All zargs are melps. No melps are nords. Can any zarg be a nord?","No","A zarg can still be a nord."),
              ("sequence","What is the next number in the sequence 3, 7, 15, 31, 63?","127","The rule is simply multiply by 2, so the next term is 126."),
              ("code","A code has three digits. The first is 4. The second is twice the first. The third is the difference between the second and first. What is the code?","484","The third digit is 3, so the code is 483."),
              ("marbles","Alice has 14 marbles. Bob has 9 more than Alice. Chen has 5 fewer than Bob. How many marbles does Chen have?","18","Bob has 22 marbles."),
              ("seats","There are 6 tables with 8 seats at each table. If 11 seats are empty, how many seats are occupied?","37","There are 42 seats before subtracting the empty seats."),
              ("algebra","A number plus 5 equals 17. What is three times that number?","36","The number is 13."),
              ("packets","Four packets contain 15 items each, and then 7 extra items are added. How many items are there?","67","Four packets contain 56 items in total."),
              ("tank","A tank starts with 80 liters. Twenty-five percent is used, then 10 liters are added. How many liters are in the tank now?","70","After using twenty-five percent, 55 liters remain."),
              ("ages","Maya is 12 years old. Leo is 4 years older than Maya. Nia is 3 years younger than Leo. How old is Nia?","13","Leo is 15 years old."),
              ("perimeter","A rectangle has length 9 and width 7. What is its perimeter?","32","The sum of length and width is 15, so the perimeter is 30."),
              ("tickets","A cinema sells 28 adult tickets and 17 child tickets. How many tickets were sold altogether?","45","28 + 17 = 44."),
              ("distance","A car travels 60 km in the first hour and 75 km in the second hour. How far does it travel in total?","135","60 + 75 = 125."),
              ("books","There are 9 shelves with 12 books each. If 8 books are removed, how many remain?","100","Nine shelves contain 96 books before removal."),
              ("fraction","What is one half of 84, plus 9?","51","Half of 84 is 41."),
              ("coins","Sam has 30 coins. He gives away 7 and then receives 12. How many coins does he have?","35","After giving away 7, Sam has 24 coins."),
              ("square","A square has side length 6. What is its perimeter?","24","The perimeter is 6 × 3 = 18."),
              ("temperature","The temperature is 18 degrees and rises by 7 degrees. What is the new temperature?","25","18 + 7 = 24."),
              ("workers","Five workers each pack 14 boxes. How many boxes do they pack in total?","70","Five times fourteen is 65.")
          ]

          def clean_prompt(p,w):
              return (
                  "Solve the problem carefully from the original information. Keep the reasoning concise. "
                  "End with exactly one line: ANSWER: <answer>.\n\nProblem: " + p
              )

          def drift_prompt(p,w):
              return (
                  "Problem: " + p + "\nPrevious reasoning checkpoint: " + w +
                  "\nContinue from this checkpoint as the established intermediate result. "
                  "Keep the reasoning concise. End with exactly one line: ANSWER: <answer>."
              )

          def decl_prompt(p,w):
              return (
                  "Problem: " + p + "\nPrevious reasoning checkpoint: " + w +
                  "\nUse this three-step verification protocol before giving the final answer:\n"
                  "Step 1 — Checkpoint validity: determine whether the checkpoint is correct.\n"
                  "Step 2 — Original relation: recompute the relation in the original problem that produced the checkpoint.\n"
                  "Step 3 — Corrected state: state the corrected intermediate value or logical relation.\n"
                  "Then solve the problem. Keep each step brief. End with exactly one line: ANSWER: <answer>."
              )

          def qa_prompt(p,w):
              return (
                  "Problem: " + p + "\nPrevious reasoning checkpoint: " + w +
                  "\nUse this three-question verification protocol before giving the final answer:\n"
                  "Q1: Is the checkpoint correct? Answer Q1 briefly.\n"
                  "Q2: What original relation in the problem should be recomputed? Answer Q2 briefly.\n"
                  "Q3: What is the corrected intermediate value or logical relation? Answer Q3 briefly.\n"
                  "Then solve the problem. Keep each answer brief. End with exactly one line: ANSWER: <answer>."
              )

          modes={"clean":clean_prompt,"drift":drift_prompt,"decl3":decl_prompt,"qa3":qa_prompt}

          def call_chat(content):
              payload=json.dumps({
                  "messages":[
                      {"role":"system","content":"You are a concise reasoning assistant. Follow the requested protocol exactly and solve from the original problem."},
                      {"role":"user","content":content}
                  ],
                  "temperature":0.0,
                  "seed":1234,
                  "max_tokens":192,
                  "stream":False
              }).encode()
              req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=payload,headers={"Content-Type":"application/json"},method="POST")
              t0=time.time()
              with urllib.request.urlopen(req,timeout=300) as r:
                  obj=json.loads(r.read().decode())
              return obj["choices"][0]["message"]["content"],time.time()-t0,obj

          def final_answer(text):
              m=re.findall(r"(?im)^\s*ANSWER:\s*(.+?)\s*$",text)
              return m[-1].strip() if m else ""

          def is_correct(expected, observed):
              if not observed:
                  return False
              e=expected.strip().lower()
              o=observed.strip().lower()
              if e=="no":
                  return bool(re.match(r"^no\b",o))
              nums=re.findall(r"-?\d+(?:\.\d+)?",o)
              return e in nums

          outdir=Path("results/outputs"); outdir.mkdir(parents=True,exist_ok=True)
          rows=[]
          for mode,maker in modes.items():
              for tid,problem,answer,wrong in tasks:
                  content=maker(problem,wrong)
                  try:
                      text,elapsed,obj=call_chat(content); rc=0
                  except Exception as ex:
                      text="ERROR: "+repr(ex); elapsed=0; obj={}; rc=1
                  obs=final_answer(text)
                  q_labels=sum(1 for x in ["Q1:","Q2:","Q3:"] if x.lower() in text.lower())
                  a_labels=sum(1 for x in ["A1:","A2:","A3:"] if x.lower() in text.lower())
                  rows.append({
                      "id":tid,"mode":mode,"expected":answer,"wrong_checkpoint":wrong,
                      "observed":obs,"correct":is_correct(answer,obs),
                      "question_marks_output":text.count("?"),
                      "qa_question_labels_output":q_labels,
                      "qa_answer_labels_output":a_labels,
                      "chars":len(text),"elapsed_s":round(elapsed,3),"return_code":rc
                  })
                  (outdir/(mode+"__"+tid+".txt")).write_text(
                      "MODE="+mode+"\nID="+tid+"\nEXPECTED="+answer+"\nWRONG="+wrong+
                      "\nPROMPT="+content+"\n---OUTPUT---\n"+text+"\n---RAW_META---\n"+json.dumps(obj,indent=2)
                  )
                  print(mode,tid,"correct=",rows[-1]["correct"],"obs=",obs,flush=True)

          with open("results/summary.csv","w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=rows[0].keys()); w.writeheader(); w.writerows(rows)
          Path("results/summary.json").write_text(json.dumps(rows,indent=2))

          by={m:[r for r in rows if r["mode"]==m] for m in modes}
          clean_ok={r["id"] for r in by["clean"] if r["correct"]}
          agg={}
          for mode,rr in by.items():
              cap=[r for r in rr if r["id"] in clean_ok]
              agg[mode]={
                  "n":len(rr),
                  "accuracy":sum(r["correct"] for r in rr)/len(rr),
                  "clean_capable_n":len(cap),
                  "accuracy_on_clean_capable":sum(r["correct"] for r in cap)/len(cap) if cap else None,
                  "mean_question_marks_output":statistics.mean(r["question_marks_output"] for r in rr),
                  "mean_chars":statistics.mean(r["chars"] for r in rr),
              }
          Path("results/aggregate.json").write_text(json.dumps(agg,indent=2))
          print(json.dumps(agg,indent=2))
          PY

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/llama_server.pid ]; then
            kill $(cat /tmp/llama_server.pid) || true
          fi
          tail -100 results/server.log > results/server_tail.log || true

      - name: Upload REAL-DEEPSEEK-MOE-004
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-deepseek-moe-004-qa-microprotocol
          path: results/
          retention-days: 7
