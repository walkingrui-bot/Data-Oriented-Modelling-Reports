name: real-deepseek-moe-011

on:
  push:
    branches:
      - exp/real-deepseek-moe-001
  workflow_dispatch:

jobs:
  reset-relative-advantage-harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Runner info
        run: |
          mkdir -p results
          uname -a | tee results/runner_info.txt
          nproc | tee -a results/runner_info.txt
          free -h | tee -a results/runner_info.txt

      - name: Download llama.cpp
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 3 -o /tmp/llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b11342/llama-b11342-bin-ubuntu-x64.tar.gz
          mkdir -p /tmp/llama
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama
          LLAMA_SERVER=$(find /tmp/llama -type f -name llama-server | head -1)
          test -n "$LLAMA_SERVER"
          chmod +x "$LLAMA_SERVER"
          echo "LLAMA_SERVER=$LLAMA_SERVER" >> "$GITHUB_ENV"

      - name: Download DeepSeekMoE-16B Chat IQ3_S
        run: |
          set -euxo pipefail
          MODEL=/tmp/deepseek-moe-16b-chat.i1-IQ3_S.gguf
          curl -L --fail --retry 8 --retry-delay 5 -o "$MODEL" "https://huggingface.co/mradermacher/deepseek-moe-16b-chat-i1-GGUF/resolve/main/deepseek-moe-16b-chat.i1-IQ3_S.gguf?download=true"
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          sha256sum "$MODEL" | tee results/model_sha256.txt

      - name: Start server
        run: |
          set -euxo pipefail
          "$LLAMA_SERVER" -m "$MODEL" -c 2048 -t 4 --host 127.0.0.1 --port 8080 --parallel 1 > results/server.log 2>&1 &
          echo $! > /tmp/llama_server.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          tail -200 results/server.log
          exit 1

      - name: Harvest reset-relative disagreement states
        run: |
          python3 - <<'PY'
          import json, csv, re, time, urllib.request, math
          from pathlib import Path

          tasks=[]

          # 8 families x 10 states = 80 states.
          # These are intentionally more structurally demanding than REAL-008/010,
          # while the wrong checkpoint preserves a useful partial scaffold.

          # 1) Larger two-digit multiplication.
          muls=[(37,24),(42,19),(34,27),(46,18),(39,26),(44,23),(31,29),(48,17),(36,28),(43,21)]
          for i,(a,b) in enumerate(muls):
              ans=a*b
              wrong=ans-(3+(i%5))
              tasks.append((f"mulhard_{i}","mulhard",
                  f"A warehouse has {a} shelves with {b} boxes on each shelf. How many boxes are there in total?",
                  str(ans),f"{a} × {b} = {wrong}."))

          # 2) Four-operation chain.
          chains=[(18,4,7,5),(22,3,11,4),(15,5,9,6),(27,2,13,5),(19,4,8,7),
                  (16,6,10,4),(24,3,14,5),(21,5,6,9),(28,2,17,3),(17,7,12,5)]
          for i,(s,mul,add,sub) in enumerate(chains):
              mid=s*mul+add
              ans=mid-sub
              wrong=mid-(2+(i%3))
              tasks.append((f"chain4_{i}","chain4",
                  f"Start with {s}. Multiply by {mul}, add {add}, then subtract {sub}. What number do you get?",
                  str(ans),f"After multiplying by {mul} and adding {add}, the running value is {wrong}."))

          # 3) Two-stage algebra: solve x then transform.
          algebra=[(3,7,52,2,5),(4,9,65,3,4),(5,6,71,2,7),(6,5,83,4,3),(3,11,62,5,6),
                   (7,4,95,2,9),(5,8,78,3,5),(4,13,77,2,11),(6,7,91,3,8),(8,5,117,2,6)]
          for i,(coef,c,rhs,k,sub) in enumerate(algebra):
              x=(rhs-c)//coef
              ans=k*x-sub
              wrong_rhs=rhs-c-1
              tasks.append((f"algebra2_{i}","algebra2",
                  f"A number x satisfies {coef}x + {c} = {rhs}. What is {k}x - {sub}?",
                  str(ans),f"Subtracting {c} gives {coef}x = {wrong_rhs}."))

          # 4) Sequential percentage adjustment.
          percs=[(200,25,20,10),(240,25,15,20),(160,25,12,10),(320,25,18,20),(280,25,16,10),
                 (360,25,24,20),(400,25,30,10),(240,25,22,10),(480,25,18,20),(200,25,14,20)]
          for i,(start,pct,add,pct2) in enumerate(percs):
              after=start*(1-pct/100)+add
              ans=after*(1-pct2/100)
              if abs(ans-round(ans))<1e-9: ans=str(int(round(ans)))
              else: ans=str(round(ans,2))
              wrong=int(start*(1-pct/100))-5-(i%3)
              tasks.append((f"percent2_{i}","percent2",
                  f"A tank starts with {start} liters. Twenty-five percent is used, then {add} liters are added, then {pct2} percent of the new amount is used. How many liters remain?",
                  ans,f"After the first twenty-five percent is used, {wrong} liters remain."))

          # 5) Perimeter with a second transformation.
          perims=[(17,9,6),(21,8,5),(18,13,7),(24,7,4),(19,12,8),
                  (23,10,6),(16,15,5),(25,9,7),(22,11,4),(20,14,8)]
          for i,(l,w,extra) in enumerate(perims):
              per=2*(l+w)
              ans=per+extra
              wrongsum=l+w-2
              tasks.append((f"perim2_{i}","perim2",
                  f"A rectangle has length {l} and width {w}. A decorative strip adds {extra} meters beyond the rectangle's perimeter. What is the total length of strip needed?",
                  str(ans),f"The sum of length and width is {wrongsum}, so the rectangle perimeter is {2*wrongsum}."))

          # 6) Product-then-subtract seating.
          seats=[(11,9,13),(12,8,17),(9,14,12),(13,7,15),(10,12,19),
                 (14,8,21),(15,7,18),(12,11,16),(13,10,22),(16,6,14)]
          for i,(tables,seatsn,empty) in enumerate(seats):
              total=tables*seatsn
              ans=total-empty
              wrong=total-(4+(i%3))
              tasks.append((f"seatshard_{i}","seatshard",
                  f"There are {tables} tables with {seatsn} seats at each table. If {empty} seats are empty, how many seats are occupied?",
                  str(ans),f"There are {wrong} seats before subtracting the empty seats."))

          # 7) Two-hop logic.
          words=[
              ("brims","tals","vors","nems"),("sarns","kels","mors","pivs"),
              ("dels","raks","wems","toks"),("farns","lops","girs","naks"),
              ("vells","dors","sims","paks"),("trens","bims","kars","jols"),
              ("mels","qars","vens","daks"),("harns","fels","ruks","zems"),
              ("pels","sors","tivs","moks"),("gans","wels","nors","beks")
          ]
          for i,(a,b,c,d) in enumerate(words):
              tasks.append((f"logic2_{i}","logic2",
                  f"All {a} are {b}. All {b} are {c}. No {c} are {d}. Can any {a} be a {d}?",
                  "No",f"Because all {a} are {b}, a {a[:-1]} can still be a {d[:-1]}."))

          # 8) Rate/cost composition.
          rates=[(7,18,25),(9,14,17),(8,21,19),(11,13,23),(6,24,16),
                 (10,17,28),(12,15,21),(9,22,18),(13,12,26),(8,25,24)]
          for i,(qty,price,disc) in enumerate(rates):
              total=qty*price
              ans=total-disc
              wrong=total-(3+(i%4))
              tasks.append((f"cost_{i}","cost",
                  f"A shop sells {qty} identical items at {price} pounds each, then applies a {disc}-pound discount to the whole purchase. What is the final cost?",
                  str(ans),f"Before the discount, the purchase total is {wrong} pounds."))

          def clean_prompt(problem):
              return (
                  "Solve the problem carefully and naturally from the original information. "
                  "At the very end, write exactly one line: ANSWER: <answer>.\n\nProblem: "+problem
              )
          def local_prompt(problem,wrong):
              return (
                  "Problem: "+problem+"\nPrevious reasoning checkpoint: "+wrong+
                  "\nThe checkpoint may be wrong. Recompute the original relation that produced it, then continue solving naturally. "
                  "At the very end, write exactly one line: ANSWER: <answer>."
              )
          def decl_prompt(problem,wrong):
              return (
                  "Problem: "+problem+"\nPrevious reasoning checkpoint: "+wrong+
                  "\nVerify the checkpoint, recompute the original relation that produced it, correct the intermediate state if needed, "
                  "then continue solving naturally. At the very end, write exactly one line: ANSWER: <answer>."
              )
          def qa_prompt(problem,wrong):
              return (
                  "Problem: "+problem+"\nPrevious reasoning checkpoint: "+wrong+
                  "\nAsk yourself whether the checkpoint is correct, identify what original relation must be recomputed, correct the state if needed, "
                  "then continue solving naturally. At the very end, write exactly one line: ANSWER: <answer>."
              )
          prompts={"clean":lambda p,w:clean_prompt(p),"local":local_prompt,"decl3":decl_prompt,"qa3":qa_prompt}

          def call_chat(content):
              payload={
                  "messages":[
                      {"role":"system","content":"You are a concise reasoning assistant. Solve the user's problem accurately."},
                      {"role":"user","content":content}
                  ],
                  "temperature":0.0,"seed":1234,"max_tokens":192,"stream":False,
                  "logprobs":True,"top_logprobs":5
              }
              req=urllib.request.Request(
                  "http://127.0.0.1:8080/v1/chat/completions",
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type":"application/json"},
                  method="POST"
              )
              t0=time.time()
              with urllib.request.urlopen(req,timeout=300) as r:
                  obj=json.loads(r.read().decode())
              return obj,time.time()-t0

          def telemetry(choice):
              content=(choice.get("logprobs") or {}).get("content") or []
              chosen=[]; entropy=[]; margins=[]
              for item in content:
                  l=item.get("logprob")
                  if isinstance(l,(int,float)): chosen.append(float(l))
                  tops=item.get("top_logprobs") or []
                  vals=[float(x.get("logprob")) for x in tops if isinstance(x.get("logprob"),(int,float))]
                  if vals:
                      probs=[math.exp(v) for v in vals]
                      residual=max(0.0,1.0-sum(probs))
                      h=-sum(p*math.log(max(p,1e-12)) for p in probs)
                      if residual>0: h-=residual*math.log(max(residual,1e-12))
                      entropy.append(h)
                      sv=sorted(vals,reverse=True)
                      if len(sv)>=2: margins.append(sv[0]-sv[1])
              def mf(xs,n):
                  ys=xs[:n]
                  return sum(ys)/len(ys) if ys else None
              return {
                  "n_tokens":len(content),
                  "mean_logprob_first_8":mf(chosen,8),
                  "mean_entropy_first_8":mf(entropy,8),
                  "mean_margin_first_8":mf(margins,8),
                  "mean_logprob_first_16":mf(chosen,16),
                  "mean_entropy_first_16":mf(entropy,16),
                  "mean_margin_first_16":mf(margins,16),
                  "mean_logprob_first_32":mf(chosen,32),
                  "mean_entropy_first_32":mf(entropy,32),
                  "mean_margin_first_32":mf(margins,32)
              }

          outdir=Path("results/trajectories"); outdir.mkdir(parents=True,exist_ok=True)
          rows=[]
          for tid,fam,problem,expected,wrong in tasks:
              for mode,maker in prompts.items():
                  obj,elapsed=call_chat(maker(problem,wrong))
                  choice=obj["choices"][0]
                  text=choice["message"]["content"]
                  stats=telemetry(choice)
                  rows.append({
                      "id":tid,"family":fam,"mode":mode,
                      "expected":expected,"wrong_checkpoint":wrong,
                      "chars":len(text),"elapsed_s":round(elapsed,3),
                      "prefix64":text[:64].replace("\n","\\n"),
                      "prefix128":text[:128].replace("\n","\\n"),
                      **stats
                  })
                  (outdir/f"{mode}__{tid}.txt").write_text(text)
                  print(mode,tid,"tokens=",stats["n_tokens"],flush=True)

          with open("results/trajectories.csv","w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=rows[0].keys()); w.writeheader(); w.writerows(rows)
          Path("results/task_manifest.json").write_text(json.dumps([
              {"id":tid,"family":fam,"problem":p,"expected":e,"wrong_checkpoint":w}
              for tid,fam,p,e,w in tasks
          ],indent=2))
          PY

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/llama_server.pid ]; then
            kill $(cat /tmp/llama_server.pid) || true
          fi
          tail -100 results/server.log > results/server_tail.log || true

      - name: Upload REAL-DEEPSEEK-MOE-011
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-deepseek-moe-011-reset-relative-advantage-harvest
          path: results/
          retention-days: 7
