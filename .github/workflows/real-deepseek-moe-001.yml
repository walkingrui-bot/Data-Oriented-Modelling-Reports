name: real-deepseek-moe-010

on:
  push:
    branches:
      - exp/real-deepseek-moe-001
  workflow_dispatch:

jobs:
  closed-loop-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Runner info
        run: |
          mkdir -p results
          uname -a | tee results/runner_info.txt
          nproc | tee -a results/runner_info.txt
          free -h | tee -a results/runner_info.txt

      - name: Download llama.cpp
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 3 -o /tmp/llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b11342/llama-b11342-bin-ubuntu-x64.tar.gz
          mkdir -p /tmp/llama
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama
          LLAMA_SERVER=$(find /tmp/llama -type f -name llama-server | head -1)
          test -n "$LLAMA_SERVER"
          chmod +x "$LLAMA_SERVER"
          echo "LLAMA_SERVER=$LLAMA_SERVER" >> "$GITHUB_ENV"

      - name: Download DeepSeekMoE-16B Chat IQ3_S
        run: |
          set -euxo pipefail
          MODEL=/tmp/deepseek-moe-16b-chat.i1-IQ3_S.gguf
          curl -L --fail --retry 8 --retry-delay 5 -o "$MODEL" "https://huggingface.co/mradermacher/deepseek-moe-16b-chat-i1-GGUF/resolve/main/deepseek-moe-16b-chat.i1-IQ3_S.gguf?download=true"
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          sha256sum "$MODEL" | tee results/model_sha256.txt

      - name: Start server
        run: |
          set -euxo pipefail
          "$LLAMA_SERVER" -m "$MODEL" -c 2048 -t 4 --host 127.0.0.1 --port 8080 --parallel 1 > results/server.log 2>&1 &
          echo $! > /tmp/llama_server.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          tail -200 results/server.log
          exit 1

      - name: Run frozen live controller on unseen tasks
        run: |
          python3 - <<'PY'
          import json, csv, re, time, urllib.request, math
          from pathlib import Path

          # Frozen REAL-009 controller. These values were fit only on REAL-008
          # training states (indices 0-7) before any REAL-010 task existed.
          FEATURES=[
              "mean_logprob_first_8","mean_entropy_first_8","mean_margin_first_8",
              "mean_logprob_first_16","mean_entropy_first_16","mean_margin_first_16"
          ]
          MEAN=[-0.312450421613148,0.5949900401984474,4.0944511746760694,
                -0.29567704633573166,0.5690190423239011,4.218605408112102]
          SCALE=[0.1408434432246444,0.18951495731986873,0.893305682409221,
                 0.14049769783825064,0.19133190778419143,0.8554253650564544]
          COEF=[-0.6787061162384517,0.1650531905489121,0.12955945761135346,
                0.31512371676918305,-1.2859387465148733,0.45680314600068156,
                -0.31373413435340575,0.5354507166583777,-0.22516239843802097]
          INTERCEPT=-0.4228510137165381
          ACTIONS=["decl3","local","qa3"]
          THRESHOLD=0.605

          Path("results/frozen_controller.json").write_text(json.dumps({
              "features":FEATURES,"mean":MEAN,"scale":SCALE,"coef":COEF,
              "intercept":INTERCEPT,"actions":ACTIONS,"reset_threshold":THRESHOLD,
              "source":"REAL-009 frozen before REAL-010"
          },indent=2))

          # 48 entirely new states: 8 families x 6 unseen parameterizations.
          tasks=[]
          for i,(a,b) in enumerate([(29,17),(31,14),(26,21),(33,16),(28,19),(35,13)]):
              ans=a*b; wrong=ans-(3+(i%3))
              tasks.append((f"mul_new_{i}","mul",f"A warehouse has {a} shelves with {b} boxes on each shelf. How many boxes are there in total?",str(ans),f"{a} × {b} = {wrong}."))
          for i,(s,add,sub) in enumerate([(61,14,9),(47,18,11),(72,13,8),(55,17,12),(68,16,7),(79,12,15)]):
              mid=s+add; ans=mid-sub
              tasks.append((f"twostep_new_{i}","twostep",f"Start with {s}. Add {add}, then subtract {sub}. What number do you get?",str(ans),f"After adding {add}, the running value is {mid-2}."))
          for i,(x,c,k) in enumerate([(19,7,3),(17,9,4),(22,6,2),(16,11,5),(21,8,3),(18,12,4)]):
              d=x+c; ans=k*x
              tasks.append((f"algebra_new_{i}","algebra",f"A number plus {c} equals {d}. What is {k} times that number?",str(ans),f"The number is {x+2}."))
          for i,(n,add) in enumerate([(176,13),(192,17),(208,9),(224,15),(240,11),(256,19)]):
              ans=int(n*0.75+add); wrong=int(n*0.75-7-(i%3))
              tasks.append((f"percent_new_{i}","percent",f"A tank starts with {n} liters. Twenty-five percent is used, then {add} liters are added. How many liters are in the tank now?",str(ans),f"After using twenty-five percent, {wrong} liters remain."))
          for i,(a,more,fewer) in enumerate([(27,8,6),(31,7,5),(29,11,4),(34,6,9),(26,13,7),(32,9,8)]):
              bob=a+more; ans=bob-fewer
              tasks.append((f"compare_new_{i}","compare",f"Alice has {a} marbles. Bob has {more} more than Alice. Chen has {fewer} fewer than Bob. How many marbles does Chen have?",str(ans),f"Bob has {bob-2} marbles."))
          for i,(l,w) in enumerate([(21,8),(18,11),(23,7),(19,13),(24,9),(22,12)]):
              ans=2*(l+w); wrongsum=l+w-2
              tasks.append((f"perim_new_{i}","perim",f"A rectangle has length {l} and width {w}. What is its perimeter?",str(ans),f"The sum of length and width is {wrongsum}, so the perimeter is {2*wrongsum}."))
          for i,(tables,seats,empty) in enumerate([(9,11,8),(8,13,7),(10,9,11),(12,8,9),(11,12,10),(13,7,6)]):
              total=tables*seats; ans=total-empty; wrong_total=total-(3+(i%2))
              tasks.append((f"seats_new_{i}","seats",f"There are {tables} tables with {seats} seats at each table. If {empty} seats are empty, how many seats are occupied?",str(ans),f"There are {wrong_total} seats before subtracting the empty seats."))
          logic_words=[
              ("braks","tels","mors"),("vins","pards","leks"),("suls","nems","gors"),
              ("trens","baks","wids"),("jels","rams","feks"),("dovs","kins","pals")
          ]
          for i,(a,b,c) in enumerate(logic_words):
              tasks.append((f"logic_new_{i}","logic",f"All {a} are {b}. No {b} are {c}. Can any {a} be a {c}?","No",f"A {a[:-1]} can still be a {c[:-1]}."))

          def clean_prompt(problem):
              return "Solve the problem carefully and naturally from the original information. Reason however you normally would. At the very end, write exactly one line: ANSWER: <answer>.\n\nProblem: "+problem
          def local_prompt(problem,wrong):
              return "Problem: "+problem+"\nPrevious reasoning checkpoint: "+wrong+"\nThe checkpoint may be wrong. Recompute the original relation that produced it, then continue solving naturally. At the very end, write exactly one line: ANSWER: <answer>."
          def decl_prompt(problem,wrong):
              return "Problem: "+problem+"\nPrevious reasoning checkpoint: "+wrong+"\nVerify the checkpoint, recompute the original relation that produced it, correct the intermediate state if needed, then continue solving naturally. At the very end, write exactly one line: ANSWER: <answer>."
          def qa_prompt(problem,wrong):
              return "Problem: "+problem+"\nPrevious reasoning checkpoint: "+wrong+"\nAsk yourself whether the checkpoint is correct, identify what original relation must be recomputed, correct the state if needed, then continue solving naturally. At the very end, write exactly one line: ANSWER: <answer>."
          prompts={"local":local_prompt,"decl3":decl_prompt,"qa3":qa_prompt}

          def call_chat(content,want_logprobs=True):
              payload={
                  "messages":[
                      {"role":"system","content":"You are a concise reasoning assistant. Solve the user's problem accurately."},
                      {"role":"user","content":content}
                  ],
                  "temperature":0.0,"seed":1234,"max_tokens":160,"stream":False
              }
              if want_logprobs:
                  payload["logprobs"]=True
                  payload["top_logprobs"]=5
              req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",
                  data=json.dumps(payload).encode(),headers={"Content-Type":"application/json"},method="POST")
              t0=time.time()
              with urllib.request.urlopen(req,timeout=300) as r:
                  obj=json.loads(r.read().decode())
              return obj,time.time()-t0

          def final_answer(text):
              m=re.findall(r"(?im)^\s*ANSWER:\s*(.+?)\s*$",text)
              return m[-1].strip() if m else ""

          def correct(expected,observed):
              if not observed: return False
              e=expected.strip().lower(); o=observed.strip().lower()
              if e=="no": return bool(re.match(r"^no\b",o))
              nums=re.findall(r"-?\d+(?:\.\d+)?",o)
              return e in nums

          def telemetry(choice):
              content=(choice.get("logprobs") or {}).get("content") or []
              chosen=[]; entropy=[]; margins=[]
              for item in content:
                  l=item.get("logprob")
                  if isinstance(l,(int,float)): chosen.append(float(l))
                  tops=item.get("top_logprobs") or []
                  vals=[float(x.get("logprob")) for x in tops if isinstance(x.get("logprob"),(int,float))]
                  if vals:
                      probs=[math.exp(v) for v in vals]
                      residual=max(0.0,1.0-sum(probs))
                      h=-sum(p*math.log(max(p,1e-12)) for p in probs)
                      if residual>0: h-=residual*math.log(max(residual,1e-12))
                      entropy.append(h)
                      sv=sorted(vals,reverse=True)
                      if len(sv)>=2: margins.append(sv[0]-sv[1])
              def meanfirst(xs,n):
                  ys=xs[:n]
                  return sum(ys)/len(ys) if ys else None
              return {
                  "mean_logprob_first_8":meanfirst(chosen,8),
                  "mean_entropy_first_8":meanfirst(entropy,8),
                  "mean_margin_first_8":meanfirst(margins,8),
                  "mean_logprob_first_16":meanfirst(chosen,16),
                  "mean_entropy_first_16":meanfirst(entropy,16),
                  "mean_margin_first_16":meanfirst(margins,16),
                  "n_tokens":len(content)
              }

          def score(action,stats):
              vals=[stats[k] for k in FEATURES]
              if any(v is None for v in vals):
                  return None
              z=INTERCEPT
              for i,v in enumerate(vals):
                  z += COEF[i]*((v-MEAN[i])/SCALE[i])
              # one-hot action coefficients occupy final three slots.
              aidx=ACTIONS.index(action)
              z += COEF[6+aidx]
              return 1.0/(1.0+math.exp(-z))

          rows=[]; outdir=Path("results/outputs"); outdir.mkdir(parents=True,exist_ok=True)
          for tid,fam,problem,expected,wrong in tasks:
              candidates={}
              # Controller sees only these candidate texts + telemetry, never expected answer.
              for action,maker in prompts.items():
                  obj,elapsed=call_chat(maker(problem,wrong),True)
                  choice=obj["choices"][0]
                  text=choice["message"]["content"]
                  stats=telemetry(choice)
                  p=score(action,stats)
                  if p is None:
                      raise RuntimeError("Missing telemetry for "+tid+" "+action)
                  candidates[action]={
                      "text":text,"observed":final_answer(text),"p_recovery":p,
                      "elapsed_s":round(elapsed,3),**stats
                  }
                  (outdir/f"{tid}__{action}.txt").write_text(text)

              best_action=max(candidates,key=lambda a:candidates[a]["p_recovery"])
              best=candidates[best_action]
              use_reset=best["p_recovery"]<THRESHOLD

              reset_text=None; reset_observed=None; reset_elapsed=None
              if use_reset:
                  robj,relapsed=call_chat(clean_prompt(problem),False)
                  reset_text=robj["choices"][0]["message"]["content"]
                  reset_observed=final_answer(reset_text)
                  reset_elapsed=round(relapsed,3)
                  (outdir/f"{tid}__RESET.txt").write_text(reset_text)
                  final_mode="reset"
                  final_observed=reset_observed
              else:
                  final_mode=best_action
                  final_observed=best["observed"]

              # Evaluation-only clean baseline. Generated after controller decision.
              if reset_text is None:
                  bobj,belapsed=call_chat(clean_prompt(problem),False)
                  baseline_text=bobj["choices"][0]["message"]["content"]
                  baseline_observed=final_answer(baseline_text)
                  baseline_elapsed=round(belapsed,3)
                  (outdir/f"{tid}__always_reset_baseline.txt").write_text(baseline_text)
              else:
                  baseline_text=reset_text; baseline_observed=reset_observed; baseline_elapsed=reset_elapsed

              row={
                  "id":tid,"family":fam,"expected":expected,
                  "selected_cheap_action":best_action,
                  "selected_cheap_p":best["p_recovery"],
                  "use_reset":int(use_reset),
                  "final_mode":final_mode,
                  "final_observed":final_observed,
                  "policy_correct":int(correct(expected,final_observed)),
                  "always_reset_observed":baseline_observed,
                  "always_reset_correct":int(correct(expected,baseline_observed)),
              }
              for action,c in candidates.items():
                  row[f"{action}_observed"]=c["observed"]
                  row[f"{action}_correct"]=int(correct(expected,c["observed"]))
                  row[f"{action}_p"]=c["p_recovery"]
                  row[f"{action}_margin16"]=c["mean_margin_first_16"]
              row["cheap_oracle"]=max(row["local_correct"],row["decl3_correct"],row["qa3_correct"])
              row["expanded_oracle"]=max(row["cheap_oracle"],row["always_reset_correct"])
              rows.append(row)
              print(tid,"best=",best_action,round(best["p_recovery"],3),"reset=",use_reset,
                    "policy=",row["policy_correct"],"baseline=",row["always_reset_correct"],flush=True)

          with open("results/closed_loop_results.csv","w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=rows[0].keys()); w.writeheader(); w.writerows(rows)
          Path("results/closed_loop_results.json").write_text(json.dumps(rows,indent=2))

          n=len(rows)
          summary={
              "n":n,
              "policy_success":sum(r["policy_correct"] for r in rows),
              "policy_rate":sum(r["policy_correct"] for r in rows)/n,
              "always_reset_success":sum(r["always_reset_correct"] for r in rows),
              "always_reset_rate":sum(r["always_reset_correct"] for r in rows)/n,
              "fixed_local_success":sum(r["local_correct"] for r in rows),
              "fixed_decl3_success":sum(r["decl3_correct"] for r in rows),
              "fixed_qa3_success":sum(r["qa3_correct"] for r in rows),
              "cheap_oracle_success":sum(r["cheap_oracle"] for r in rows),
              "expanded_oracle_success":sum(r["expanded_oracle"] for r in rows),
              "reset_calls":sum(r["use_reset"] for r in rows),
              "reset_rate":sum(r["use_reset"] for r in rows)/n,
              "paired_policy_wins_vs_reset":sum(r["policy_correct"]>r["always_reset_correct"] for r in rows),
              "paired_policy_losses_vs_reset":sum(r["policy_correct"]<r["always_reset_correct"] for r in rows),
          }
          Path("results/summary.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/llama_server.pid ]; then
            kill $(cat /tmp/llama_server.pid) || true
          fi
          tail -100 results/server.log > results/server_tail.log || true

      - name: Upload REAL-DEEPSEEK-MOE-010
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-deepseek-moe-010-closed-loop-acceptance
          path: results/
          retention-days: 7
