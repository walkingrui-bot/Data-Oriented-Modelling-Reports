name: real-deepseek-moe-007

on:
  push:
    branches:
      - exp/real-deepseek-moe-001
  workflow_dispatch:

jobs:
  two-step-continuation-signature:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Runner info
        run: |
          mkdir -p results
          uname -a | tee results/runner_info.txt
          nproc | tee -a results/runner_info.txt
          free -h | tee -a results/runner_info.txt

      - name: Download llama.cpp
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 3 -o /tmp/llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b11342/llama-b11342-bin-ubuntu-x64.tar.gz
          mkdir -p /tmp/llama
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama
          LLAMA_SERVER=$(find /tmp/llama -type f -name llama-server | head -1)
          test -n "$LLAMA_SERVER"
          chmod +x "$LLAMA_SERVER"
          echo "LLAMA_SERVER=$LLAMA_SERVER" >> "$GITHUB_ENV"

      - name: Download DeepSeekMoE-16B Chat IQ3_S
        run: |
          set -euxo pipefail
          MODEL=/tmp/deepseek-moe-16b-chat.i1-IQ3_S.gguf
          curl -L --fail --retry 8 --retry-delay 5 -o "$MODEL" "https://huggingface.co/mradermacher/deepseek-moe-16b-chat-i1-GGUF/resolve/main/deepseek-moe-16b-chat.i1-IQ3_S.gguf?download=true"
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          sha256sum "$MODEL" | tee results/model_sha256.txt

      - name: Start server
        run: |
          set -euxo pipefail
          "$LLAMA_SERVER" -m "$MODEL" -c 1536 -t 4 --host 127.0.0.1 --port 8080 --parallel 1 > results/server.log 2>&1 &
          echo $! > /tmp/llama_server.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          tail -200 results/server.log
          exit 1

      - name: Generate two-step continuation signatures
        run: |
          python3 - <<'PY'
          import json, csv, re, time, urllib.request
          from pathlib import Path

          tasks=[]
          for i,(a,b) in enumerate([(13,17),(16,19),(21,14),(24,18),(27,13)]):
              ans=a*b; wrong=ans-(2+i)
              tasks.append((f"mul_{i}","mul",f"A warehouse has {a} shelves with {b} boxes on each shelf. How many boxes are there in total?",str(ans),f"{a} × {b} = {wrong}."))
          for i,(s,a,b) in enumerate([(30,11,7),(42,9,5),(25,14,6),(36,8,13),(50,12,9)]):
              mid=s+a; ans=mid-b
              tasks.append((f"twostep_{i}","twostep",f"Start with {s}. Add {a}, then subtract {b}. What number do you get?",str(ans),f"After adding {a}, the running value is {mid-1}."))
          for i,(x,c,k) in enumerate([(8,5,3),(11,4,2),(7,9,4),(13,6,3),(9,8,5)]):
              d=x+c; ans=k*x
              tasks.append((f"algebra_{i}","algebra",f"A number plus {c} equals {d}. What is {k} times that number?",str(ans),f"The number is {x+1}."))
          for i,(n,add) in enumerate([(80,10),(120,15),(64,8),(100,5),(160,20)]):
              ans=int(n*0.75+add); wrong=int(n*0.75-5)
              tasks.append((f"percent_{i}","percent",f"A tank starts with {n} liters. Twenty-five percent is used, then {add} liters are added. How many liters are in the tank now?",str(ans),f"After using twenty-five percent, {wrong} liters remain."))
          for i,(a,b,c) in enumerate([(14,9,5),(18,7,4),(20,6,8),(11,13,3),(25,5,7)]):
              bob=a+b; ans=bob-c
              tasks.append((f"compare_{i}","compare",f"Alice has {a} marbles. Bob has {b} more than Alice. Chen has {c} fewer than Bob. How many marbles does Chen have?",str(ans),f"Bob has {bob-1} marbles."))
          for i,(l,w) in enumerate([(9,7),(12,5),(8,6),(14,4),(11,9)]):
              ans=2*(l+w)
              tasks.append((f"perim_{i}","perim",f"A rectangle has length {l} and width {w}. What is its perimeter?",str(ans),f"The sum of length and width is {l+w-1}, so the perimeter is {2*(l+w-1)}."))
          for i,(n,e,extra) in enumerate([(4,15,7),(6,12,5),(5,18,4),(7,11,9),(3,24,6)]):
              prod=n*e; ans=prod+extra
              tasks.append((f"pack_{i}","pack",f"{n} packets contain {e} items each, and then {extra} extra items are added. How many items are there?",str(ans),f"{n} packets contain {prod-4} items in total."))
          logic_sets=[("zargs","melps","nords"),("flims","daxes","vorps"),("taves","lunds","keps"),("marns","sopes","rids"),("quels","bims","naks")]
          for i,(a,b,c) in enumerate(logic_sets):
              tasks.append((f"logic_{i}","logic",f"All {a} are {b}. No {b} are {c}. Can any {a} be a {c}?","No",f"A {a[:-1]} can still be a {c[:-1]}."))

          protocols = {
              "local": lambda p,w: (
                  "Problem: "+p+"\nWrong checkpoint: "+w+
                  "\nCandidate rescue action: LOCAL. First recompute only the relation that produced the checkpoint. "
                  "Then take exactly one additional reasoning step toward the final solution using the corrected state. "
                  "Do not finish the whole problem unless that single next step necessarily is the final operation. "
                  "Output exactly two lines:\nSTATE: <corrected local relation or value>\nNEXT: <one immediate next reasoning step>."
              ),
              "decl3": lambda p,w: (
                  "Problem: "+p+"\nWrong checkpoint: "+w+
                  "\nCandidate rescue action: DECL3. Use the declarative verification sequence to reconstruct the corrected state, "
                  "then take exactly one additional declarative reasoning step toward the final solution. "
                  "Do not continue beyond that one next step. "
                  "Output exactly two lines:\nSTATE: <corrected local relation or value>\nNEXT: <one immediate next reasoning step>."
              ),
              "qa3": lambda p,w: (
                  "Problem: "+p+"\nWrong checkpoint: "+w+
                  "\nCandidate rescue action: QA3. Use Q1/Q2/Q3 internally to reconstruct the corrected state, "
                  "then take exactly one additional Q/A-style reasoning step toward the final solution. "
                  "Do not continue beyond that one next step. "
                  "Output exactly two lines:\nSTATE: <corrected local relation or value>\nNEXT: <one immediate next reasoning step>."
              ),
          }

          def call_chat(content):
              payload=json.dumps({
                  "messages":[
                      {"role":"system","content":"You are a concise reasoning controller. Perform exactly the requested two-step probe and stop."},
                      {"role":"user","content":content}
                  ],
                  "temperature":0.0,
                  "seed":1234,
                  "max_tokens":72,
                  "stream":False
              }).encode()
              req=urllib.request.Request(
                  "http://127.0.0.1:8080/v1/chat/completions",
                  data=payload,
                  headers={"Content-Type":"application/json"},
                  method="POST"
              )
              t0=time.time()
              with urllib.request.urlopen(req,timeout=300) as r:
                  obj=json.loads(r.read().decode())
              return obj["choices"][0]["message"]["content"], time.time()-t0

          outdir=Path("results/signatures"); outdir.mkdir(parents=True,exist_ok=True)
          rows=[]
          for tid,fam,problem,expected,wrong in tasks:
              for action,maker in protocols.items():
                  text,elapsed=call_chat(maker(problem,wrong))
                  sm=re.findall(r"(?im)^\s*STATE:\s*(.+?)\s*$",text)
                  nm=re.findall(r"(?im)^\s*NEXT:\s*(.+?)\s*$",text)
                  state=sm[-1].strip() if sm else ""
                  nxt=nm[-1].strip() if nm else ""
                  rows.append({
                      "id":tid,"family":fam,"action":action,"expected":expected,
                      "wrong_checkpoint":wrong,
                      "state":state,"next":nxt,
                      "state_present":int(bool(state)),
                      "next_present":int(bool(nxt)),
                      "raw_text":text.replace("\n","\\n"),
                      "chars":len(text),"elapsed_s":round(elapsed,3)
                  })
                  (outdir/f"{action}__{tid}.txt").write_text(text)
                  print(action,tid,"STATE=",state[:60],"NEXT=",nxt[:60],flush=True)

          with open("results/two_step_signatures.csv","w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=rows[0].keys()); w.writeheader(); w.writerows(rows)
          Path("results/two_step_signatures.json").write_text(json.dumps(rows,indent=2))
          PY

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/llama_server.pid ]; then
            kill $(cat /tmp/llama_server.pid) || true
          fi
          tail -100 results/server.log > results/server_tail.log || true

      - name: Upload REAL-DEEPSEEK-MOE-007
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-deepseek-moe-007-two-step-continuation-signatures
          path: results/
          retention-days: 7
