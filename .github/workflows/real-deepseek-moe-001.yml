name: real-deepseek-moe-005

on:
  push:
    branches:
      - exp/real-deepseek-moe-001
  workflow_dispatch:

jobs:
  learned-protocol-router:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Runner info
        run: |
          mkdir -p results
          uname -a | tee results/runner_info.txt
          nproc | tee -a results/runner_info.txt
          free -h | tee -a results/runner_info.txt

      - name: Download llama.cpp
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 3 -o /tmp/llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b11342/llama-b11342-bin-ubuntu-x64.tar.gz
          mkdir -p /tmp/llama
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama
          LLAMA_SERVER=$(find /tmp/llama -type f -name llama-server | head -1)
          test -n "$LLAMA_SERVER"
          chmod +x "$LLAMA_SERVER"
          echo "LLAMA_SERVER=$LLAMA_SERVER" >> "$GITHUB_ENV"
          "$LLAMA_SERVER" --version | tee results/llama_server_version.txt

      - name: Download DeepSeekMoE-16B Chat IQ3_S
        run: |
          set -euxo pipefail
          MODEL=/tmp/deepseek-moe-16b-chat.i1-IQ3_S.gguf
          curl -L --fail --retry 8 --retry-delay 5 -o "$MODEL" "https://huggingface.co/mradermacher/deepseek-moe-16b-chat-i1-GGUF/resolve/main/deepseek-moe-16b-chat.i1-IQ3_S.gguf?download=true"
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          ls -lh "$MODEL" | tee results/model_file.txt
          sha256sum "$MODEL" | tee results/model_sha256.txt

      - name: Start server
        run: |
          set -euxo pipefail
          "$LLAMA_SERVER" -m "$MODEL" -c 2048 -t 4 --host 127.0.0.1 --port 8080 --parallel 1 > results/server.log 2>&1 &
          echo $! > /tmp/llama_server.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              free -h | tee results/memory_after_server.txt
              exit 0
            fi
            sleep 2
          done
          tail -200 results/server.log
          exit 1

      - name: Generate labels and train protocol router
        run: |
          python3 - <<'PY'
          import json, csv, re, time, urllib.request, statistics, random
          from pathlib import Path
          import numpy as np

          random.seed(20261002)

          tasks=[]
          # 8 families x 5 instances = 40 tasks.
          for i,(a,b) in enumerate([(13,17),(16,19),(21,14),(24,18),(27,13)]):
              ans=a*b
              wrong=ans-(2+i)
              tasks.append((f"mul_{i}","mul",f"A warehouse has {a} shelves with {b} boxes on each shelf. How many boxes are there in total?",str(ans),f"{a} × {b} = {wrong}."))
          for i,(s,a,b) in enumerate([(30,11,7),(42,9,5),(25,14,6),(36,8,13),(50,12,9)]):
              mid=s+a
              ans=mid-b
              tasks.append((f"twostep_{i}","twostep",f"Start with {s}. Add {a}, then subtract {b}. What number do you get?",str(ans),f"After adding {a}, the running value is {mid-1}."))
          for i,(x,c,k) in enumerate([(8,5,3),(11,4,2),(7,9,4),(13,6,3),(9,8,5)]):
              d=x+c
              ans=k*x
              tasks.append((f"algebra_{i}","algebra",f"A number plus {c} equals {d}. What is {k} times that number?",str(ans),f"The number is {x+1}."))
          for i,(n,add) in enumerate([(80,10),(120,15),(64,8),(100,5),(160,20)]):
              ans=int(n*0.75+add)
              wrong=int(n*0.75-5)
              tasks.append((f"percent_{i}","percent",f"A tank starts with {n} liters. Twenty-five percent is used, then {add} liters are added. How many liters are in the tank now?",str(ans),f"After using twenty-five percent, {wrong} liters remain."))
          for i,(a,b,c) in enumerate([(14,9,5),(18,7,4),(20,6,8),(11,13,3),(25,5,7)]):
              bob=a+b
              ans=bob-c
              tasks.append((f"compare_{i}","compare",f"Alice has {a} marbles. Bob has {b} more than Alice. Chen has {c} fewer than Bob. How many marbles does Chen have?",str(ans),f"Bob has {bob-1} marbles."))
          for i,(l,w) in enumerate([(9,7),(12,5),(8,6),(14,4),(11,9)]):
              ans=2*(l+w)
              tasks.append((f"perim_{i}","perim",f"A rectangle has length {l} and width {w}. What is its perimeter?",str(ans),f"The sum of length and width is {l+w-1}, so the perimeter is {2*(l+w-1)}."))
          for i,(n,e,extra) in enumerate([(4,15,7),(6,12,5),(5,18,4),(7,11,9),(3,24,6)]):
              prod=n*e
              ans=prod+extra
              tasks.append((f"pack_{i}","pack",f"{n} packets contain {e} items each, and then {extra} extra items are added. How many items are there?",str(ans),f"{n} packets contain {prod-4} items in total."))
          logic_sets=[
              ("zargs","melps","nords"),
              ("flims","daxes","vorps"),
              ("taves","lunds","keps"),
              ("marns","sopes","rids"),
              ("quels","bims","naks"),
          ]
          for i,(a,b,c) in enumerate(logic_sets):
              tasks.append((f"logic_{i}","logic",f"All {a} are {b}. No {b} are {c}. Can any {a} be a {c}?","No",f"A {a[:-1]} can still be a {c[:-1]}."))

          protocols = {
              "local": lambda p,w: (
                  "Problem: "+p+"\nPrevious reasoning checkpoint: "+w+
                  "\nRecompute only the original relation that produced this checkpoint, replace the checkpoint with the corrected relation, then finish the problem. "
                  "Keep the response short. End with exactly one line: ANSWER: <answer>."
              ),
              "decl3": lambda p,w: (
                  "Problem: "+p+"\nPrevious reasoning checkpoint: "+w+
                  "\nUse this verification protocol: (1) determine whether the checkpoint is correct; "
                  "(2) recompute the original relation that produced it; (3) state the corrected intermediate value or logical relation; then finish the problem. "
                  "Keep the response concise. End with exactly one line: ANSWER: <answer>."
              ),
              "qa3": lambda p,w: (
                  "Problem: "+p+"\nPrevious reasoning checkpoint: "+w+
                  "\nUse this three-question protocol: Q1: Is the checkpoint correct? Q2: What original relation should be recomputed? "
                  "Q3: What is the corrected intermediate value or logical relation? Answer each briefly, then finish the problem. "
                  "End with exactly one line: ANSWER: <answer>."
              ),
          }

          def clean_prompt(p):
              return "Solve carefully from the original information. Keep the response concise. End with exactly one line: ANSWER: <answer>.\n\nProblem: "+p

          def call_chat(content,max_tokens=128):
              payload=json.dumps({
                  "messages":[
                      {"role":"system","content":"You are a concise reasoning assistant. Solve from the stated problem and follow the requested protocol."},
                      {"role":"user","content":content}
                  ],
                  "temperature":0.0,
                  "seed":1234,
                  "max_tokens":max_tokens,
                  "stream":False
              }).encode()
              req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=payload,headers={"Content-Type":"application/json"},method="POST")
              t0=time.time()
              with urllib.request.urlopen(req,timeout=300) as r:
                  obj=json.loads(r.read().decode())
              return obj["choices"][0]["message"]["content"],time.time()-t0,obj

          def final_answer(text):
              m=re.findall(r"(?im)^\s*ANSWER:\s*(.+?)\s*$",text)
              return m[-1].strip() if m else ""

          def is_correct(expected, observed):
              if not observed:
                  return False
              e=expected.lower().strip()
              o=observed.lower().strip()
              if e=="no":
                  return bool(re.match(r"^no\b",o))
              nums=re.findall(r"-?\d+(?:\.\d+)?",o)
              return e in nums

          outdir=Path("results/outputs"); outdir.mkdir(parents=True,exist_ok=True)
          rows=[]
          for tid,fam,problem,answer,wrong in tasks:
              # Clean capability
              text,elapsed,obj=call_chat(clean_prompt(problem),96)
              obs=final_answer(text)
              clean_ok=is_correct(answer,obs)
              rows.append({
                  "id":tid,"family":fam,"mode":"clean","expected":answer,"observed":obs,"correct":clean_ok,
                  "chars":len(text),"elapsed_s":round(elapsed,3)
              })
              (outdir/f"clean__{tid}.txt").write_text(text)
              print("clean",tid,clean_ok,obs,flush=True)

              for mode,maker in protocols.items():
                  text,elapsed,obj=call_chat(maker(problem,wrong),144)
                  obs=final_answer(text)
                  ok=is_correct(answer,obs)
                  rows.append({
                      "id":tid,"family":fam,"mode":mode,"expected":answer,"observed":obs,"correct":ok,
                      "chars":len(text),"elapsed_s":round(elapsed,3)
                  })
                  (outdir/f"{mode}__{tid}.txt").write_text(text)
                  print(mode,tid,ok,obs,flush=True)

          with open("results/raw_results.csv","w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=rows[0].keys()); w.writeheader(); w.writerows(rows)
          Path("results/raw_results.json").write_text(json.dumps(rows,indent=2))

          # Build supervised protocol-routing dataset on clean-capable tasks.
          byid={}
          for r in rows:
              byid.setdefault(r["id"],{})[r["mode"]]=r

          examples=[]
          for tid,fam,problem,answer,wrong in tasks:
              rr=byid[tid]
              if not rr["clean"]["correct"]:
                  continue
              rewards={m:int(rr[m]["correct"]) for m in protocols}
              # Tie-break by shorter output among successful protocols; if none succeeds, choose shortest protocol output.
              successful=[m for m,v in rewards.items() if v==1]
              if successful:
                  best=min(successful,key=lambda m: rr[m]["chars"])
              else:
                  best=min(protocols,key=lambda m: rr[m]["chars"])
              idx=int(tid.rsplit("_",1)[1])
              split="train" if idx<3 else "test"
              examples.append({
                  "id":tid,"family":fam,"problem":problem,"wrong_checkpoint":wrong,"split":split,
                  "best_protocol":best,
                  **{f"reward_{m}":rewards[m] for m in protocols},
                  **{f"chars_{m}":rr[m]["chars"] for m in protocols},
              })

          # Tiny learned controller: multinomial logistic regression over character n-gram TF-IDF.
          # Install sklearn lazily only if unavailable.
          try:
              from sklearn.feature_extraction.text import TfidfVectorizer
              from sklearn.linear_model import LogisticRegression
          except Exception:
              import subprocess,sys
              subprocess.run([sys.executable,"-m","pip","install","-q","scikit-learn"],check=True)
              from sklearn.feature_extraction.text import TfidfVectorizer
              from sklearn.linear_model import LogisticRegression

          train=[e for e in examples if e["split"]=="train"]
          test=[e for e in examples if e["split"]=="test"]
          Xtrain=[e["problem"]+" [CHECKPOINT] "+e["wrong_checkpoint"] for e in train]
          ytrain=[e["best_protocol"] for e in train]
          Xtest=[e["problem"]+" [CHECKPOINT] "+e["wrong_checkpoint"] for e in test]

          vec=TfidfVectorizer(analyzer="char_wb",ngram_range=(2,5),min_df=1,max_features=4000)
          Xt=vec.fit_transform(Xtrain)
          Xv=vec.transform(Xtest)
          clf=LogisticRegression(max_iter=3000,C=2.0,multi_class="auto")
          clf.fit(Xt,ytrain)
          pred=clf.predict(Xv)

          eval_rows=[]
          protocols_list=list(protocols)
          for e,predicted in zip(test,pred):
              fixed={m:e[f"reward_{m}"] for m in protocols_list}
              oracle=max(fixed.values())
              random_exp=sum(fixed.values())/len(protocols_list)
              selected=fixed[predicted]
              eval_rows.append({
                  "id":e["id"],"family":e["family"],"predicted_protocol":predicted,
                  "best_protocol_label":e["best_protocol"],
                  "selected_reward":selected,
                  "oracle_reward":oracle,
                  "random_expected_reward":random_exp,
                  **fixed,
              })

          with open("results/router_train_examples.csv","w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=train[0].keys()); w.writeheader(); w.writerows(train)
          with open("results/router_test_results.csv","w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=eval_rows[0].keys()); w.writeheader(); w.writerows(eval_rows)

          n=len(eval_rows)
          metrics={
              "clean_capable_total":len(examples),
              "train_n":len(train),"test_n":len(test),
              "fixed_local_acc":sum(r["local"] for r in eval_rows)/n,
              "fixed_decl3_acc":sum(r["decl3"] for r in eval_rows)/n,
              "fixed_qa3_acc":sum(r["qa3"] for r in eval_rows)/n,
              "random_expected_acc":sum(r["random_expected_reward"] for r in eval_rows)/n,
              "learned_selector_acc":sum(r["selected_reward"] for r in eval_rows)/n,
              "protocol_oracle_acc":sum(r["oracle_reward"] for r in eval_rows)/n,
              "best_label_match":sum(r["predicted_protocol"]==r["best_protocol_label"] for r in eval_rows)/n,
              "test_family_counts":{fam:sum(r["family"]==fam for r in eval_rows) for fam in sorted(set(r["family"] for r in eval_rows))}
          }
          Path("results/metrics.json").write_text(json.dumps(metrics,indent=2))
          print(json.dumps(metrics,indent=2))
          PY

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/llama_server.pid ]; then
            kill $(cat /tmp/llama_server.pid) || true
          fi
          tail -100 results/server.log > results/server_tail.log || true

      - name: Upload REAL-DEEPSEEK-MOE-005
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-deepseek-moe-005-learned-protocol-router
          path: results/
          retention-days: 7
