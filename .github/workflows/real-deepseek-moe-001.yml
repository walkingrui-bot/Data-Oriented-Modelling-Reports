name: real-deepseek-moe-001

on:
  push:
    branches:
      - exp/real-deepseek-moe-001
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Runner info
        run: |
          mkdir -p results
          {
            echo "date=$(date -u +%FT%TZ)"
            uname -a
            nproc
            free -h
            df -h /
          } | tee results/runner_info.txt

      - name: Download llama.cpp binary
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 3 -o /tmp/llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b11342/llama-b11342-bin-ubuntu-x64.tar.gz
          mkdir -p /tmp/llama
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama
          LLAMA_CLI=$(find /tmp/llama -type f -name llama-cli | head -1)
          test -n "$LLAMA_CLI"
          chmod +x "$LLAMA_CLI"
          echo "LLAMA_CLI=$LLAMA_CLI" >> "$GITHUB_ENV"
          "$LLAMA_CLI" --version | tee results/llama_version.txt

      - name: Download real DeepSeekMoE-16B Chat IQ3_S
        run: |
          set -euxo pipefail
          MODEL=/tmp/deepseek-moe-16b-chat.i1-IQ3_S.gguf
          curl -L --fail --retry 8 --retry-delay 5 -o "$MODEL" "https://huggingface.co/mradermacher/deepseek-moe-16b-chat-i1-GGUF/resolve/main/deepseek-moe-16b-chat.i1-IQ3_S.gguf?download=true"
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          ls -lh "$MODEL" | tee results/model_file.txt
          sha256sum "$MODEL" | tee results/model_sha256.txt
          free -h | tee results/memory_before_inference.txt
          df -h / | tee results/disk_before_inference.txt

      - name: Run deterministic ASK vs DECL baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/ask results/decl
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, json, csv, re, os, time

          tasks = [
              ("arithmetic","A warehouse has 17 shelves with 23 boxes on each shelf. How many boxes are there in total?","391"),
              ("composition","Start with 7. Multiply by 3, add 2, then multiply the result by 2. What number do you get?","46"),
              ("logic","All zargs are melps. No melps are nords. Can any zarg be a nord?","No"),
              ("sequence","What is the next number in the sequence 3, 7, 15, 31, 63?","127"),
              ("constraint","A code has three digits. The first is 4. The second is twice the first. The third is the difference between the second and first. What is the code?","488"),
              ("comparison","Alice has 14 marbles, Bob has 9 more than Alice, and Chen has 5 fewer than Bob. How many marbles does Chen have?","18"),
          ]
          modes = {
              "ask":"Solve the problem using a short chain of self-questions. Phrase each reasoning step as a question followed by a brief answer. End with exactly one line beginning FINAL:.",
              "decl":"Solve the problem using short declarative reasoning statements. Do not ask yourself questions. End with exactly one line beginning FINAL:.",
          }
          llama=os.environ["LLAMA_CLI"]
          model=os.environ["MODEL"]
          rows=[]
          for mode,instruction in modes.items():
              for tid,q,expected in tasks:
                  prompt=f"{instruction}\n\nProblem: {q}"
                  cmd=[
                      "/usr/bin/time","-v",llama,
                      "-m",model,
                      "-p",prompt,
                      "-n","160",
                      "-c","1024",
                      "-t","4",
                      "--temp","0",
                      "--seed","1234",
                      "--single-turn",
                      "--no-display-prompt",
                      "--no-show-timings",
                  ]
                  t0=time.time()
                  cp=subprocess.run(cmd,input="",text=True,capture_output=True,timeout=240)
                  elapsed=time.time()-t0
                  body=cp.stdout
                  stderr=cp.stderr
                  out=Path("results")/mode/f"{tid}.txt"
                  out.write_text(
                      f"ID={tid}\nMODE={mode}\nEXPECTED={expected}\nPROMPT={prompt}\nRETURN_CODE={cp.returncode}\nELAPSED_S={elapsed:.3f}\n---STDOUT---\n{body}\n---STDERR---\n{stderr}"
                  )
                  m=re.findall(r"(?im)^\s*FINAL:\s*(.+?)\s*$", body)
                  final=m[-1].strip() if m else ""
                  correct=bool(final and expected.lower() in final.lower())
                  rows.append({
                      "id":tid,"mode":mode,"expected":expected,"final":final,
                      "correct":correct,"question_marks":body.count("?"),
                      "chars":len(body),"elapsed_s":round(elapsed,3),
                      "return_code":cp.returncode
                  })

          Path("results/summary.json").write_text(json.dumps(rows,indent=2))
          with open("results/summary.csv","w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=rows[0].keys()); w.writeheader(); w.writerows(rows)
          for mode in ["ask","decl"]:
              rr=[x for x in rows if x["mode"]==mode]
              print(mode, "accuracy", sum(x["correct"] for x in rr),"/",len(rr),
                    "mean_question_marks", sum(x["question_marks"] for x in rr)/len(rr),
                    "mean_elapsed_s", sum(x["elapsed_s"] for x in rr)/len(rr))
          PY
          cat results/summary.csv

      - name: Upload real DeepSeek baseline
        uses: actions/upload-artifact@v4
        with:
          name: real-deepseek-moe-001-iq3s-baseline
          path: results/
          retention-days: 7
