name: real-deepseek-moe-015

on:
  push:
    branches:
      - exp/real-deepseek-moe-001
  workflow_dispatch:

jobs:
  frozen-closure-motion-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Runner info
        run: |
          mkdir -p results
          uname -a | tee results/runner_info.txt
          nproc | tee -a results/runner_info.txt
          free -h | tee -a results/runner_info.txt

      - name: Download llama.cpp
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 3 -o /tmp/llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b11342/llama-b11342-bin-ubuntu-x64.tar.gz
          mkdir -p /tmp/llama
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama
          LLAMA_SERVER=$(find /tmp/llama -type f -name llama-server | head -1)
          test -n "$LLAMA_SERVER"
          chmod +x "$LLAMA_SERVER"
          echo "LLAMA_SERVER=$LLAMA_SERVER" >> "$GITHUB_ENV"

      - name: Download DeepSeekMoE-16B Chat IQ3_S
        run: |
          set -euxo pipefail
          MODEL=/tmp/deepseek-moe-16b-chat.i1-IQ3_S.gguf
          curl -L --fail --retry 8 --retry-delay 5 -o "$MODEL" "https://huggingface.co/mradermacher/deepseek-moe-16b-chat-i1-GGUF/resolve/main/deepseek-moe-16b-chat.i1-IQ3_S.gguf?download=true"
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          sha256sum "$MODEL" | tee results/model_sha256.txt

      - name: Start server
        run: |
          set -euxo pipefail
          "$LLAMA_SERVER" -m "$MODEL" -c 2048 -t 4 --host 127.0.0.1 --port 8080 --parallel 1 > results/server.log 2>&1 &
          echo $! > /tmp/llama_server.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          tail -200 results/server.log
          exit 1

      - name: Run frozen closure-motion controller
        run: |
          python3 - <<'PY'
          import json, csv, re, time, urllib.request, math
          from pathlib import Path
          from collections import defaultdict, deque

          # Frozen reset-relative advantage model.
          ADV_MEAN=[3.66506645,3.79506864,3.83416695,3.27161949,3.70434108,4.92017548,0.39344697,0.09072756,-1.08600853]
          ADV_SCALE=[0.85734903,0.86554829,0.79200918,1.22084926,1.21465805,1.08642669,1.25464422,1.36293031,1.16720512]
          ADV_COEF=[-0.411354891,-0.582587745,0.799368546,0.322557552,0.636039886,-0.798731049,-0.594964572,-0.936826182,1.28586650,-0.317277358,0.00127615535,0.315562092]
          ADV_INTERCEPT=-1.9404355472637143
          ADV_THRESHOLD=0.878
          ACTIONS=["decl3","local","qa3"]

          # Frozen REAL-014 generic trajectory-motion readout.
          MOTION_MEAN=[74.12962962962963,12.342592592592593,0.6062669702623301,0.2238628965702807,0.16339319933560062,0.052108207416187304,0.21028998155331144,0.1300075790876486,0.43017462229470244,0.28703703703703703,0.9814814814814815,0.5833333333333334]
          MOTION_SCALE=[55.40291685605661,10.206354263523176,0.2796420962825666,0.19373607649855176,0.1542026129171597,0.08179947479390269,0.253082111514922,0.17342623797088128,0.3957767191164143,0.7077733201402353,1.4655392224775248,0.4930066485916347]
          MOTION_COEF=[-0.04393162454494044,-0.41290535876001505,0.7578045530523472,0.055570909244429346,0.1987835052344271,0.28343024096908065,-0.20035452659870054,0.011430382387231215,0.6942676066711115,0.22600408942580405,-0.25915532371267996,0.6732701874797111]
          MOTION_INTERCEPT=-0.010439781647241894
          MOTION_THRESHOLD=0.245

          Path("results/frozen_controller.json").write_text(json.dumps({
              "advantage_threshold":ADV_THRESHOLD,
              "motion_threshold":MOTION_THRESHOLD,
              "motion_training_source":"REAL-013 relational candidates",
              "decision":"RESET unless structural scaffold exists and a cheap candidate passes both advantage and motion gates"
          },indent=2))

          def stem(w):
              w=''.join(ch for ch in w.lower() if ch.isalnum())
              if len(w)>3 and w.endswith('s'):
                  w=w[:-1]
              return w

          def parse_scaffold(problem):
              edges=[]; forbidden=[]; src=None; tgt=None
              sentences=[x.strip() for x in re.split('[.!?]',problem.lower()) if x.strip()]
              for s in sentences:
                  toks=s.replace(',',' ').split()
                  if len(toks)>=4 and toks[0]=='all' and 'are' in toks:
                      j=toks.index('are')
                      if j>=2 and j+1<len(toks): edges.append((stem(toks[1]),stem(toks[j+1])))
                  elif len(toks)>=4 and toks[0]=='every' and 'is' in toks:
                      j=toks.index('is')
                      k=j+1
                      if k<len(toks) and toks[k] in ('a','an'): k+=1
                      if k<len(toks): edges.append((stem(toks[1]),stem(toks[k])))
                  elif len(toks)>=4 and toks[0]=='no' and 'are' in toks:
                      j=toks.index('are')
                      forbidden.append((stem(toks[1]),stem(toks[j+1])))
                  elif len(toks)>=4 and toks[0]=='no' and 'is' in toks:
                      j=toks.index('is')
                      k=j+1
                      if k<len(toks) and toks[k] in ('a','an'): k+=1
                      if k<len(toks): forbidden.append((stem(toks[1]),stem(toks[k])))
                  if len(toks)>=5 and toks[0]=='can' and toks[1]=='any' and 'be' in toks:
                      j=toks.index('be')
                      src=stem(toks[2])
                      k=j+1
                      if k<len(toks) and toks[k] in ('a','an'): k+=1
                      if k<len(toks): tgt=stem(toks[k])

              if not src or not tgt:
                  return {"has_scaffold":0,"closure_depth":0,"n_edges":len(edges),"n_forbidden":len(forbidden)}
              g=defaultdict(list)
              for a,b in edges: g[a].append(b)
              q=deque([(src,0)]); seen={src}; best=None
              while q:
                  u,d=q.popleft()
                  for v in g[u]:
                      nd=d+1
                      if (v,tgt) in forbidden or (tgt,v) in forbidden:
                          best=nd if best is None else min(best,nd)
                      if v not in seen:
                          seen.add(v); q.append((v,nd))
              return {"has_scaffold":int(best is not None and best>=2),
                      "closure_depth":int(best or 0),"n_edges":len(edges),"n_forbidden":len(forbidden)}

          def clean_prompt(problem):
              return "Solve the problem carefully and naturally from the original information. At the very end, write exactly one line: ANSWER: <answer>.\n\nProblem: "+problem
          def local_prompt(problem,wrong):
              return "Problem: "+problem+"\nPrevious reasoning checkpoint: "+wrong+"\nThe checkpoint may be wrong. Recompute the original relation that produced it, then continue solving naturally. At the very end, write exactly one line: ANSWER: <answer>."
          def decl_prompt(problem,wrong):
              return "Problem: "+problem+"\nPrevious reasoning checkpoint: "+wrong+"\nVerify the checkpoint, recompute the original relation that produced it, correct the intermediate state if needed, then continue solving naturally. At the very end, write exactly one line: ANSWER: <answer>."
          def qa_prompt(problem,wrong):
              return "Problem: "+problem+"\nPrevious reasoning checkpoint: "+wrong+"\nAsk yourself whether the checkpoint is correct, identify what original relation must be recomputed, correct the state if needed, then continue solving naturally. At the very end, write exactly one line: ANSWER: <answer>."
          prompts={"local":local_prompt,"decl3":decl_prompt,"qa3":qa_prompt}

          def call_chat(content):
              payload={"messages":[
                  {"role":"system","content":"You are a concise reasoning assistant. Solve the user's problem accurately."},
                  {"role":"user","content":content}],
                  "temperature":0.0,"seed":1234,"max_tokens":192,"stream":False,
                  "logprobs":True,"top_logprobs":5}
              req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",
                  data=json.dumps(payload).encode(),headers={"Content-Type":"application/json"},method="POST")
              t0=time.time()
              with urllib.request.urlopen(req,timeout=300) as r:
                  obj=json.loads(r.read().decode())
              return obj,time.time()-t0

          def margin_stats(choice):
              content=(choice.get("logprobs") or {}).get("content") or []
              margins=[]
              for item in content:
                  vals=[float(x.get("logprob")) for x in (item.get("top_logprobs") or [])
                        if isinstance(x.get("logprob"),(int,float))]
                  sv=sorted(vals,reverse=True)
                  if len(sv)>=2: margins.append(sv[0]-sv[1])
              def mf(n):
                  xs=margins[:n]
                  return sum(xs)/len(xs) if xs else None
              return {"margin8":mf(8),"margin16":mf(16),"margin32":mf(32),"n_tokens":len(content)}

          def p_adv(action,c,r):
              vals=[c["margin8"],c["margin16"],c["margin32"],
                    r["margin8"],r["margin16"],r["margin32"],
                    c["margin8"]-r["margin8"],c["margin16"]-r["margin16"],c["margin32"]-r["margin32"]]
              z=ADV_INTERCEPT
              for i,v in enumerate(vals): z += ADV_COEF[i]*((v-ADV_MEAN[i])/ADV_SCALE[i])
              z += ADV_COEF[9+ACTIONS.index(action)]
              return 1/(1+math.exp(-z))

          def split_sentences(text):
              return [s.strip() for s in re.split('(?<=[.?!])\\s+|\\n+',text) if s.strip()]

          def motion_features(text):
              sents=split_sentences(text)
              words=[w.lower() for w in re.findall('[a-zA-Z0-9]+',text)]
              n=len(words)
              def rep_ratio(k):
                  grams=[tuple(words[i:i+k]) for i in range(max(0,n-k+1))]
                  return 0.0 if not grams else 1-len(set(grams))/len(grams)
              sets=[set(w.lower() for w in re.findall('[a-zA-Z]+',s) if len(w)>2) for s in sents]
              sims=[len(a&b)/max(1,len(a|b)) for a,b in zip(sets,sets[1:])]
              ns=[re.sub('\\s+',' ',re.sub('[^a-z0-9 ]','',s.lower())).strip() for s in sents]
              cut=max(1,int(n*0.75)) if n else 0
              prev=set(words[:cut]); last=words[cut:] if n else []
              infer=sum(text.lower().count(x) for x in ['therefore','thus','hence','conclude','so we','this means','which means','as a result'])
              loop=sum(text.lower().count(x) for x in ['check if','recompute','repeat','again','next step','continue to the next step'])
              return [n,len(sents),len(set(words))/max(1,n),rep_ratio(2),rep_ratio(3),
                      sum(sims)/len(sims) if sims else 0.0,max(sims) if sims else 0.0,
                      1-len(set(ns))/max(1,len(ns)),
                      sum(w not in prev for w in last)/max(1,len(last)),
                      infer,loop,int(bool(re.search('\\banswer\\b',text.lower())))]

          def p_motion(text):
              vals=motion_features(text)
              z=MOTION_INTERCEPT
              for i,v in enumerate(vals):
                  z += MOTION_COEF[i]*((v-MOTION_MEAN[i])/MOTION_SCALE[i])
              return 1/(1+math.exp(-z)),vals

          tasks=[]

          # New relational chains: depths 2-5.
          roots=[
              ("dors","vems","paks","nils"),("fars","kems","tols","bivs"),("girs","naks","wels","sops"),("hars","pims","dels","voks"),
              ("jirs","raks","mels","tovs"),("kors","sims","qels","naks"),("lars","wems","foks","pivs"),("mors","bels","tims","daks"),
              ("nirs","gels","vors","kaps"),("pors","hims","sels","waks"),("qirs","loms","fems","baks"),("rors","tels","gims","vaks"),
              ("sirs","pems","dols","naks"),("tors","kels","wims","faks"),("virs","rams","nels","paks"),("wors","mels","qims","daks")
          ]
          for i,(a,b,c,d) in enumerate(roots):
              depth=2+(i%4)
              mids=[b]+[f"mid{i}_{j}s" for j in range(max(0,depth-2))]+[c]
              clauses=[f"All {a} are {mids[0]}."]
              for x,y in zip(mids,mids[1:]): clauses.append(f"All {x} are {y}.")
              clauses.append(f"No {mids[-1]} are {d}.")
              clauses.append(f"Can any {a} be a {d}?")
              problem=' '.join(clauses)
              wrong=f"A {a[:-1]} can still be a {d[:-1]} because the final exclusion only names {mids[-1]}."
              tasks.append((f"deep_rel_{i}","deep_rel",problem,"No",wrong))

          # Paraphrased chains.
          para=[
              ("zars","fems","nols","paks"),("beks","rims","tovs","daks"),("cirs","wems","loks","naks"),("dels","pims","vors","gaks"),
              ("firs","kals","qems","taks"),("gels","mors","sivs","baks"),("hirs","nels","woks","paks"),("jels","rams","tims","daks"),
              ("kirs","fels","voms","naks"),("lors","gems","qivs","baks"),("mirs","tels","foks","paks"),("nors","wels","rims","daks")
          ]
          for i,(a,b,c,d) in enumerate(para):
              problem=f"Every {a[:-1]} is a {b[:-1]}. Every {b[:-1]} is a {c[:-1]}. No {c[:-1]} is a {d[:-1]}. Can any {a[:-1]} be a {d[:-1]}?"
              wrong=f"A {a[:-1]} might still be a {d[:-1]} because the exclusion only refers to {c[:-1]}."
              tasks.append((f"para_live_{i}","para_live",problem,"No",wrong))

          # Branching/distractor relation graphs.
          branch=[
              ("braks","mels","tovs","naks","rims"),("crens","pels","vors","daks","sims"),("drals","wels","noms","baks","qars"),("frens","dels","pivs","loks","tims"),
              ("grals","fels","saks","vins","nors"),("hrens","bems","qins","toks","gels"),("jrals","lums","dors","paks","fims"),("krens","vems","kols","naks","wirs"),
              ("lrals","pems","rivs","baks","dels"),("mrens","nems","sovs","feks","lars"),("nrals","tels","mirs","qaks","pels"),("prens","kems","wors","daks","sals")
          ]
          for i,(a,b,c,d,x) in enumerate(branch):
              problem=(f"All {a} are {b}. All {b} are {c}. No {c} are {d}. "
                       f"All {x} are {b}. No {x} are {d}. Can any {a} be a {d}?")
              wrong=f"A {a[:-1]} can still be a {d[:-1]} because only the separate {x} branch is excluded."
              tasks.append((f"branch_live_{i}","branch_live",problem,"No",wrong))

          # Arithmetic controls: structural gate should keep RESET.
          costs=[(24,17,29),(19,26,31),(28,15,34),(21,29,27),(25,18,36),(17,32,25),(23,24,33),(26,19,28),(22,27,35),(29,16,30)]
          for i,(q,p,disc) in enumerate(costs):
              total=q*p; ans=total-disc; wrong=total-(4+i%4)
              problem=f"A shop sells {q} identical items at {p} pounds each, then applies a {disc}-pound discount to the whole purchase. What is the final cost?"
              checkpoint=f"Before the discount, the purchase total is {wrong} pounds."
              tasks.append((f"cost_control_{i}","cost_control",problem,str(ans),checkpoint))

          seq=[(37,4,13,8),(31,5,11,9),(44,3,16,7),(33,6,10,12),(29,7,14,5),(36,5,17,11),(42,4,12,9),(28,8,9,13),(39,6,15,7),(35,7,18,10)]
          for i,(s,m,a,b) in enumerate(seq):
              mid=s*m+a; ans=mid-b; wrong=mid-(2+i%3)
              problem=f"Start with {s}. Multiply by {m}, add {a}, then subtract {b}. What number do you get?"
              checkpoint=f"After multiplying by {m} and adding {a}, the running value is {wrong}."
              tasks.append((f"seq_control_{i}","seq_control",problem,str(ans),checkpoint))

          outdir=Path("results/outputs"); outdir.mkdir(parents=True,exist_ok=True)
          rows=[]
          for tid,fam,problem,expected,wrong in tasks:
              scaffold=parse_scaffold(problem)
              robj,_=call_chat(clean_prompt(problem))
              rchoice=robj["choices"][0]; rtext=rchoice["message"]["content"]; rstats=margin_stats(rchoice)
              (outdir/f"{tid}__RESET.txt").write_text(rtext)

              candidates={}
              for action,maker in prompts.items():
                  obj,_=call_chat(maker(problem,wrong))
                  choice=obj["choices"][0]; text=choice["message"]["content"]; stats=margin_stats(choice)
                  pa=p_adv(action,stats,rstats); pm,mf=p_motion(text)
                  candidates[action]={"text":text,"p_adv":pa,"p_motion":pm,"motion_features":mf}
                  (outdir/f"{tid}__{action}.txt").write_text(text)

              eligible={a:c for a,c in candidates.items() if c["p_adv"]>=ADV_THRESHOLD and c["p_motion"]>=MOTION_THRESHOLD}
              if scaffold["has_scaffold"] and eligible:
                  best_action=max(eligible,key=lambda a:eligible[a]["p_motion"])
                  use_cheap=True
              else:
                  best_action="reset"; use_cheap=False
              final_mode=best_action if use_cheap else "reset"

              row={"id":tid,"family":fam,"expected":expected,"wrong_checkpoint":wrong,
                   **scaffold,"use_cheap":int(use_cheap),"final_mode":final_mode}
              for a,c in candidates.items():
                  row[f"{a}_p_adv"]=c["p_adv"]; row[f"{a}_p_motion"]=c["p_motion"]
              rows.append(row)
              print(tid,"scaffold=",scaffold["has_scaffold"],"depth=",scaffold["closure_depth"],
                    "eligible=",list(eligible.keys()),"final=",final_mode,flush=True)

          with open("results/live_results.csv","w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=rows[0].keys()); w.writeheader(); w.writerows(rows)
          Path("results/live_results.json").write_text(json.dumps(rows,indent=2))
          Path("results/task_manifest.json").write_text(json.dumps([
              {"id":tid,"family":fam,"problem":p,"expected":e,"wrong_checkpoint":w}
              for tid,fam,p,e,w in tasks],indent=2))
          PY

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/llama_server.pid ]; then
            kill $(cat /tmp/llama_server.pid) || true
          fi
          tail -100 results/server.log > results/server_tail.log || true

      - name: Upload REAL-DEEPSEEK-MOE-015
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-deepseek-moe-015-frozen-closure-motion-live
          path: results/
          retention-days: 7
